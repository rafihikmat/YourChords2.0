
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourChords | AI Guitar Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#020617', // Slate 950
              primary: '#3B82F6', // Electric Blue
              secondary: '#8B5CF6', // Neon Violet
            },
            animation: {
              spotlight: "spotlight 2s ease .75s 1 forwards",
              shimmer: "shimmer 2s linear infinite",
            },
            keyframes: {
              spotlight: {
                "0%": { opacity: 0, transform: "translate(-72%, -62%) scale(0.5)" },
                "100%": { opacity: 1, transform: "translate(-50%, -40%) scale(1)" },
              },
              shimmer: {
                from: { backgroundPosition: "0 0" },
                to: { backgroundPosition: "-200% 0" },
              },
            },
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for Cyber-Zen feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      /* Light Mode Scrollbar */
      html:not(.dark) ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* Slate 300 */
        border-radius: 4px;
      }
      html:not(.dark) ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* Slate 400 */
      }

      /* Dark Mode Scrollbar */
      html.dark ::-webkit-scrollbar-thumb {
        background: #1e293b; /* Slate 800 */
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #334155; /* Slate 700 */
      }
      
      html.dark body {
        background-color: #020617;
        color: #ffffff;
      }
      
      html:not(.dark) body {
        background-color: #f8fafc;
        color: #0f172a;
      }

      /* --- CHORD SHEET JS STYLES (Futuristic) --- */
      
      .chord-sheet-container .chord-sheet,
      .chord-sheet-container .chord-sheet-table {
        width: 100% !important;
        border-collapse: separate !important;
        border-spacing: 0 4px !important; /* Add slight row spacing */
        table-layout: auto !important;
        display: table !important;
        margin-bottom: 2rem;
      }

      /* Force rows */
      .chord-sheet-container tr {
        display: table-row !important; 
        background: transparent !important;
        border: none !important;
      }

      /* Force cells & inherit font size for slider to work */
      .chord-sheet-container td, 
      .chord-sheet-container .chord, 
      .chord-sheet-container .lyrics {
        display: table-cell !important; 
        vertical-align: bottom !important;
        padding-right: 0.5em !important;
        padding-bottom: 0.5em !important;
        white-space: pre !important;
        border: none !important;
        font-size: inherit !important; /* CRITICAL: Allows parent font-size to control children */
      }

      /* Chords with Neon Glow Effect */
      .chord-sheet-container .chord {
        color: #FACC15; /* Yellow-400 brightness */
        font-weight: 700;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.9em !important; /* Relative to inherited size */
        line-height: 1.4;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        padding-bottom: 2px !important;
      }
      
      /* Dark mode specific glow */
      html.dark .chord-sheet-container .chord {
        text-shadow: 0 0 12px rgba(250, 204, 21, 0.2); /* Subtle yellow glow */
      }
      
      .chord-sheet-container .chord:hover {
        color: #8B5CF6; /* Violet */
        text-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
        transform: translateY(-1px);
      }

      /* Lyrics Styling */
      .chord-sheet-container .lyrics {
        font-family: 'JetBrains Mono', monospace !important;
        color: inherit;
        font-size: 1em !important;
        line-height: 1.6; /* Better readability */
        opacity: 0.9;
      }

      /* Section Headers (e.g. [Chorus]) */
      .chord-sheet-container .comment {
        display: inline-block;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        font-family: 'Inter', sans-serif !important;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.75em !important; /* Fixed small size relative to base */
        padding: 4px 12px;
        border-radius: 99px;
        background: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: #94a3b8;
      }
      
      /* Light mode overrides for headers */
      html:not(.dark) .chord-sheet-container .comment {
        background: #e2e8f0;
        color: #475569;
        border-color: #cbd5e1;
      }
      
      .chord-sheet-container .paragraph {
        margin-bottom: 1rem;
      }

      /* Theme-specific text colors */
      html.dark .chord-sheet-container .lyrics {
        color: #e2e8f0; /* Slate 200 */
      }

      html:not(.dark) .chord-sheet-container .lyrics {
        color: #334155; /* Slate 700 */
      }

      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: white !important; color: black !important; }
        html { background: white !important; color: black !important; }
        
        .chord-sheet-container .chord {
            color: #000 !important;
            font-weight: 800 !important;
            text-shadow: none !important;
        }
        .chord-sheet-container .comment {
            border: 1px solid #000;
            color: #000;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^3.4.0",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.84.0",
    "@google/genai": "https://esm.run/@google/genai",
    "chordsheetjs": "https://aistudiocdn.com/chordsheetjs@^12.3.1",
    "fuse.js": "https://aistudiocdn.com/fuse.js@^7.1.0",
    "mammoth": "https://esm.sh/mammoth@1.6.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
