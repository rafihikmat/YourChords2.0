
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YourChords | AI Guitar Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              background: '#020617', // Slate 950
              primary: '#3B82F6', // Electric Blue
              secondary: '#8B5CF6', // Neon Violet
            },
            animation: {
              spotlight: "spotlight 2s ease .75s 1 forwards",
              shimmer: "shimmer 2s linear infinite",
            },
            keyframes: {
              spotlight: {
                "0%": { opacity: 0, transform: "translate(-72%, -62%) scale(0.5)" },
                "100%": { opacity: 1, transform: "translate(-50%, -40%) scale(1)" },
              },
              shimmer: {
                from: { backgroundPosition: "0 0" },
                to: { backgroundPosition: "-200% 0" },
              },
            },
          },
        },
      }
    </script>
    <style>
      /* Custom scrollbar for Cyber-Zen feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      /* Light Mode Scrollbar */
      html:not(.dark) ::-webkit-scrollbar-thumb {
        background: #cbd5e1; /* Slate 300 */
        border-radius: 4px;
      }
      html:not(.dark) ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; /* Slate 400 */
      }

      /* Dark Mode Scrollbar */
      html.dark ::-webkit-scrollbar-thumb {
        background: #1e293b; /* Slate 800 */
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #334155; /* Slate 700 */
      }
      
      html.dark body {
        background-color: #020617;
        color: #ffffff;
      }
      
      html:not(.dark) body {
        background-color: #f8fafc;
        color: #0f172a;
      }

      /* --- CHORD SHEET JS STYLES (Cyber-Zen) --- */
      .chord-sheet-container {
        font-family: 'JetBrains Mono', monospace;
        line-height: 1.6;
      }
      
      .chord-sheet-container .paragraph {
        margin-bottom: 2rem;
      }

      .chord-sheet-container .row {
        display: flex;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
        align-items: flex-end; /* Align lyrics to bottom */
      }

      .chord-sheet-container .column {
        display: flex;
        flex-direction: column;
        margin-right: 0.5rem; /* Spacing between chord/lyric pairs */
      }

      .chord-sheet-container .chord {
        color: #3B82F6; /* Primary Blue */
        font-weight: 700;
        font-size: 0.9em;
        margin-bottom: 0.1rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .chord-sheet-container .chord:hover {
        color: #8B5CF6; /* Secondary Violet */
        transform: translateY(-2px);
        text-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
      }

      html.dark .chord-sheet-container .lyrics {
        color: #e2e8f0; /* Slate 200 */
      }

      html:not(.dark) .chord-sheet-container .lyrics {
        color: #334155; /* Slate 700 */
      }
      
      /* Comment/Header Styles */
      .chord-sheet-container .comment {
        display: block;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8; /* Slate 400 */
        font-size: 0.85em;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        width: 100%;
      }

      @media print {
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        body { background: white !important; color: black !important; }
        html { background: white !important; color: black !important; }
        
        /* Ensure text wraps and looks good on paper */
        pre, code { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
        }
        
        .chord-sheet-container .chord {
            color: #000 !important;
            font-weight: 800 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^3.4.0",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.84.0",
    "@google/genai": "https://esm.run/@google/genai",
    "chordsheetjs": "https://cdn.jsdelivr.net/npm/chordsheetjs@9.0.0/+esm"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
